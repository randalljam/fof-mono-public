<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Test of Integrated Chatbot</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700|Poppins:300,regular,500,600,700,800|Inter:regular" rel="stylesheet">
    <style>
        body { font-family: 'Lato', sans-serif; padding: 20px; }
        textarea, button { width: 100%; margin-top: 10px; padding: 10px; }
        .info { background: #f1f1f1; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Local Chatbot Test</h2>
    <p>Insert any description here.</p>
    <div>
        <textarea id="userInput" placeholder="Input text here" style="height: 50px; box-sizing: border-box;"></textarea>
        <button id="submitButton">Submit</button>
    </div>
    <div class="info" id="userQuestion">User Question: <span id="displayUserQuestion"></span></div>
    <div class="info" id="routePreamble">Route Preamble: <span id="displayRoutePreamble"></span></div>
    <div class="info" id="quotedQA">Quoted QA: <span id="displayQuotedQA"></span></div>
    <div class="info" id="aiAnswer">AI Answer: <span id="displayAiAnswer"></span></div>

    <script src="webflow_bot-test.js"></script> <!-- Ensure this points to your JavaScript file -->
</body>
</html>
