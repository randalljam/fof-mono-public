<!DOCTYPE html>
<!-- Deutsch content-tools landing page. Served by ctools/server.py, which injects
     __CT_TOKEN__ and __TOOLS_JSON__. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch Content Tools</title>
<style>
  :root { --bg: #f4f1ec; --panel: #fffdf9; --ink: #26231f; --muted: #81786c; --border: #ded6ca; --accent: #2f6f8f; --accent-soft: #e5f0f4; --bad: #a6543d; --ok: #4f835b; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--border); }
  h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .sub { color: var(--muted); font-size: 12.5px; }
  main { max-width: 920px; margin: 28px auto; padding: 0 18px; }
  .tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .tool { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .tool h2 { font-size: 15px; margin: 0 0 6px; }
  .status { display: inline-block; border-radius: 6px; padding: 2px 7px; font-size: 11.5px; color: #fff; margin-bottom: 10px; }
  .installed { background: var(--ok); } .missing { background: var(--bad); }
  a.button { display: inline-block; text-decoration: none; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 7px; padding: 6px 10px; font-size: 13px; }
  a.disabled { pointer-events: none; opacity: .45; background: #fff; color: var(--muted); border-color: var(--border); }
  code { background: var(--accent-soft); padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>Deutsch Content Tools</h1>
  <span class="sub">local shared harness for interject, redo, and forge</span>
</header>
<main>
  <div class="tools" id="tools"></div>
</main>
<script>
const TOKEN = "__CT_TOKEN__";
const TOOLS = __TOOLS_JSON__;
const descriptions = {
  interject: "Insert clearly labeled virtual Deutsch responses into external transcripts where claims diverge from grounded sources.",
  redo: "Rewrite existing content as a divergence-aware optimistic version, with a per-change diff cited to the graph.",
  forge: "Generate new essays, lessons, or dialogues grounded in graph sources, with a validated citations sidecar."
};
document.getElementById("tools").innerHTML = TOOLS.map(t => `
  <section class="tool">
    <h2>${t.label}</h2>
    <span class="status ${t.installed ? "installed" : "missing"}">${t.installed ? "installed" : "missing"}</span>
    <p>${descriptions[t.key] || ""}</p>
    <p><code>${t.module}</code></p>
    <a class="button ${t.installed ? "" : "disabled"}" href="${t.installed ? t.page : "#"}">Open</a>
  </section>`).join("");
</script>
</body>
</html>
