# Fly.io config — Lesson Logger Dashboard
# App name is set during `fly apps create`; update here after creation.
app = 'fof-lesson-dash'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  LESSONS_DB = '/data/lessons.db'
  PREFS_DB = '/data/dashboard_state.sqlite'
  SCHEDULE_DIR = '/data/schedule'
  HERMES_LESSON_DB_URL = 'http://[FLY-APP-NAME].internal:8081/lesson-logger/lessons.db'
  HERMES_SCHEDULE_BASE_URL = 'http://[FLY-APP-NAME].internal:8081/family-schedule'
  DASH_DEV_PASSWORDS = 'true'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = 'dashboard_data'
  destination = '/data'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
