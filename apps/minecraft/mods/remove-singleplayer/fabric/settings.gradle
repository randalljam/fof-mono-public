// Fabric gradle root for remove-singleplayer. Houses the three Fabric targets
// (fabric-1.21.1, fabric-1.21.11, fabric-26.1.2). The sibling forge/ directory is a
// separate gradle root (Gradle 8.10.2 wrapper, ForgeGradle 6) because ForgeGradle 6
// rejects Gradle 9; see minecraft/mods/CLAUDE.md § "Gradle wrapper version per mod"
// for the cross-mod rule.

pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'remove-singleplayer-fabric'

// ALL_TARGETS is the master list of valid target names handled by this gradle root.
// DEFAULT_TARGETS is what gets included in the project graph when you don't pass
// -Ptargets=... Both lists are Fabric-only; the Forge target lives in the sibling
// forge/ directory.
def ALL_TARGETS = [
    'fabric-1.21.1',
    'fabric-1.21.11',
    'fabric-26.1.2',
]
def DEFAULT_TARGETS = [
    'fabric-1.21.1',
    'fabric-1.21.11',
    'fabric-26.1.2',
]

def selectedRaw = startParameter.projectProperties.get('targets') ?: System.getProperty('targets')
def selected = selectedRaw ? selectedRaw.split(/[\s,]+/).findAll { it } as List : new ArrayList(DEFAULT_TARGETS)

def taskNames = startParameter.taskNames ?: []
ALL_TARGETS.each { name ->
    def needle = ":targets:${name}:"
    if (taskNames.any { it.contains(needle) }) {
        if (!selected.contains(name)) selected.add(name)
    }
}

selected.each { name ->
    if (!ALL_TARGETS.contains(name)) {
        throw new GradleException("Unknown target '${name}'. Known: ${ALL_TARGETS.join(', ')}")
    }
}

selected.each { name ->
    include "targets:${name}"
    project(":targets:${name}").projectDir = file("targets/${name}")
}

include 'common'
include 'shared'

gradle.ext.selectedTargets = selected
