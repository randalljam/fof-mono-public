# Per-target versions for Fabric on Minecraft 1.21.1. Cross-reference
# https://fabricmc.net/develop/ and https://github.com/FabricMC/fabric-example-mod/tree/1.21.1
# when bumping. The values below match the canonical Fabric example mod's 1.21.1 branch
# (gradle.properties at github.com/FabricMC/fabric-example-mod, 1.21.1 branch).

minecraft_version=1.21.1
loader_version=0.19.2
fabric_version=0.116.12+1.21.1

# Loom 1.14 supports Minecraft 1.21.x and is happy on the Gradle 9.x wrapper this
# fabric/ gradle root uses. The plugin declaration uses "${loom_version}.+", so the
# latest 1.14.x will be picked up. (Bumped from 1.7 when this mod restructured into
# nested loader gradle roots; see CHANGELOG 0.3.0.)
loom_version=1.14
