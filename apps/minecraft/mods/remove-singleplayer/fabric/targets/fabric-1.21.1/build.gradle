// Fabric build for Minecraft 1.21.1. Source is consumed from the sibling `fabric/`
// module via srcDir, and from `common/` for any loader-agnostic code. This file is
// near-identical to targets/fabric-1.21.11/build.gradle — only the per-target version
// pins live in this directory's gradle.properties.

plugins {
    id 'fabric-loom' version "${loom_version}.+"
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.version}-mc${project.minecraft_version}"
}

sourceSets {
    main {
        java {
            srcDirs = [
                rootProject.file('shared/src/main/java'),
                rootProject.file('common/src/main/java'),
            ]
        }
        resources {
            srcDirs = [
                'src/main/resources',                              // target-local: fabric.mod.json
                rootProject.file('shared/src/main/resources'),     // shared (currently empty)
            ]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
}
