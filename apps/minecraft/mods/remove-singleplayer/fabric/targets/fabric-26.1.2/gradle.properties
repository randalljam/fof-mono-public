# Per-target versions for Fabric on Minecraft 26.1.2 (first unobfuscated release line).
# Cross-reference https://fabricmc.net/develop/ when bumping. Mappings come from Mojang
# directly via the Loom plugin — no remap step needed for the 26.x line since the shipped
# bytecode is already in Mojang names. Values mirror mathquest's fabric-26.1.2/gradle.properties.

minecraft_version=26.1.2
loader_version=0.18.5
fabric_version=0.146.1+26.1.2

# New Loom plugin id (`net.fabricmc.fabric-loom`) starts at 1.15. The legacy `fabric-loom`
# id is gone for 26.1+. 1.15+ requires Gradle 9.x — which the fabric/ gradle root wrapper
# already provides.
loom_version=1.15
