// Multi-project build for MathQuest. Each loader+Minecraft-version combination is a separate
// subproject under targets/. The shared Fabric-flavoured source lives in fabric/. The common/
// module is reserved for loader-agnostic code (currently a placeholder).

pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        // Forge maven (uncomment when forge target is enabled):
        // maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'mathquest'

// ALL_TARGETS is the master list of valid target names. DEFAULT_TARGETS is what gets
// included in the project graph when you don't pass -Ptargets=...; we keep that
// conservative (just the targets that build cleanly today) so a fresh checkout doesn't
// fail trying to resolve plugins for targets that aren't yet usable.
//
// To opt in to a target that's not in DEFAULT_TARGETS, pass it explicitly:
//   ./gradlew buildAll -Ptargets=fabric-1.21.11,fabric-26.1.2
//   ./gradlew :targets:fabric-26.1.2:build -Ptargets=fabric-26.1.2
//
// Targets referenced directly in the requested task list (e.g. `:targets:foo:build`) are
// auto-included so you don't need -Ptargets in that case.
// fabric-26.1.2 is the primary target (Java 25, Mojang-named, no-remap Loom).
// fabric-1.21.11 is preserved capability: the last Yarn/obfuscated era target. Keep it
// in the multi-target apparatus — the codebase's reference for building against pre-26.1.
def ALL_TARGETS = [
    'fabric-26.1.2',
    'fabric-1.21.11',
    // 'forge-1.20.1',   // FUTURE: enable once forge port begins
]
def DEFAULT_TARGETS = [
    'fabric-26.1.2',
    'fabric-1.21.11',
]

def selectedRaw = startParameter.projectProperties.get('targets') ?: System.getProperty('targets')
def selected = selectedRaw ? selectedRaw.split(/[\s,]+/).findAll { it } as List : new ArrayList(DEFAULT_TARGETS)

// Auto-include any target the user asked for via task path, e.g. `:targets:fabric-26.1.2:build`.
def taskNames = startParameter.taskNames ?: []
ALL_TARGETS.each { name ->
    def needle = ":targets:${name}:"
    if (taskNames.any { it.contains(needle) }) {
        if (!selected.contains(name)) selected.add(name)
    }
}

selected.each { name ->
    if (!ALL_TARGETS.contains(name)) {
        throw new GradleException("Unknown target '${name}'. Known: ${ALL_TARGETS.join(', ')}")
    }
}

// Only include the selected targets in the project graph. Targets that aren't included
// have their build.gradle ignored entirely — Gradle won't try to resolve their plugins,
// so e.g. fabric-26.1.2's Loom 1.15 requirement doesn't break a 1.21.11-only build on
// the Gradle 8.14 wrapper.
selected.each { name ->
    include "targets:${name}"
    project(":targets:${name}").projectDir = file("targets/${name}")
}

include 'common'
include 'shared'

gradle.ext.selectedTargets = selected
