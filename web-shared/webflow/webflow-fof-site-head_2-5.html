/* ===== SOURCE PAGE STYLES for transcript and qa html pages ===== */
.source-page {
    margin: 0 auto;
    max-width: 700px;
    padding-left: 50px;
    padding-right: 50px;
    padding-top: 0;  /* Add this to remove top padding */
    padding-bottom: 50px;
    hyphens: auto;
    overflow-wrap: break-word;
    text-rendering: optimizeLegibility;
    font-kerning: normal;
}

/* Headings */
.source-page h1 {
    margin-top: 0;
    line-height: 1.2;  /* 2-5-25 RT Add this line to control spacing between wrapped lines */
}
.source-page h1,
.source-page h2,
.source-page h3 {
    font-size: 20px;
    margin-bottom: 0.5em;
}
.source-page h1, 
.source-page h2, 
.source-page h3, 
.source-page h4{
    font-weight: 700;
}
.source-page h4 {
    margin: .3em 0;
    padding: 0;
}
.source-page p::first-line {
    font-weight: 700;
}
.source-page p strong:not(:first-child) {
    font-weight: 700;
    color: #ff0000;
}

/* Details/Summary structure */
.source-page details {
    margin: 0.1em 0;
    padding: 0;
    border: none;
    font-family: Lato, sans-serif;
}
.source-page summary {
    cursor: pointer;
    padding: 0;
    list-style: none;
    display: flex;
    align-items: center;
    font-weight: 700;
    color: #0c02c5;
}
.source-page summary::before {
    content: "›";
    display: inline-block;
    margin-right: 0.5em;
    transition: transform 0.2s;
    font-size: 1.5em;
    transform: translateY(0em);
    color: #0c02c5;
}
.source-page details[open] > summary::before {
    transform: translateY(0em) rotate(90deg);
}
.source-page summary::-webkit-details-marker {
    display: none;
}
.source-page details > p {
    padding-left: 30px;
    padding-right: 10px;
    font-size: 14px;
    margin-top: 2px;
}

/* Nested details */
.source-page details details {
    margin-left: 20px;
    margin-top: 0.5em;
}
.source-page details details > summary {
    --question-color: #cc0000;  /* Define color once */
    font-size: 16px;
    color: var(--question-color);
    font-weight: 700;
}
.source-page details details > summary::before {   /* Collapse arrow character */
    font-size: 20px;  /* Match the text size */
    color: var(--question-color);  /* Use same color variable */
}
/* Double nested details (Answers) */
.source-page details details details {
    margin-left: 10px;
    margin-top: 0.5em;
}
.source-page details details details > summary {
    --answer-color: #2a2525;  /* Define color once */
    font-size: 16px;
    color: var(--answer-color);
    font-weight: normal;
}
.source-page details details details > summary::before {
    font-size: 16px;  /* Match the text size */
    color: var(--answer-color);  /* Use same color variable */
}

/* Header and control panel */
.source-page header {
    position: sticky;
    top: 0;
    background: #fdfdfd;
    padding: 0 0 10px 0;  /* Change this from padding: 10px 0 to only have bottom padding */
    z-index: 100;
    border-bottom: 1px solid #eee;
    text-align: center;
}
.source-page .control-panel {
    display: flex;
    gap: 10px;
    margin: 10px 0;
    justify-content: center;
}
.source-page .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
}
.source-page .header-row h3 {
    text-align: left;
}
.button-small-text {
    font-size: 14px;
    line-height: 1.2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.button-orange {
    background-color: #ff9933;
}

/* Print styles */
@media print {
    .source-page {
        background-color: transparent;
        color: black;
        font-size: 16pt;
    }
    
    .source-page p, 
    .source-page h2, 
    .source-page h3 {
        orphans: 3;
        widows: 3;
    }
    
    .source-page h2, 
    .source-page h3, 
    .source-page h4 {
        page-break-after: avoid;
    }
}

/* Mobile responsiveness */
@media screen and (max-width: 767px) {
    .source-page {
        font-size: 0.9em;
        padding: 12px;
    }
}
@media (max-width: 600px) {
    .source-page {
        font-size: 0.9em;
        padding: 4px;
    }
    
    .source-page h1 {
        font-size: 1.2em;
