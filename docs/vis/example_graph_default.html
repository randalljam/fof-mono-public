 "manage_inventory", "shape": "dot", "title": "manage_inventory"}, {"font": {"color": "white"}, "group": "C", "id": "C3", "label": "handle_distribution", "shape": "dot", "title": "handle_distribution"}, {"font": {"color": "white"}, "group": "C", "id": "C4", "label": "manage_farm_finances", "shape": "dot", "title": "manage_farm_finances"}, {"font": {"color": "white"}, "group": "C", "id": "C5", "label": "hire_farm_workers", "shape": "dot", "title": "hire_farm_workers"}, {"font": {"color": "white"}, "group": "C", "id": "C6", "label": "oversee_farm_operations", "shape": "dot", "title": "oversee_farm_operations"}, {"font": {"color": "white"}, "group": "C", "id": "C7", "label": "run_large_scale_farm", "shape": "dot", "title": "run_large_scale_farm"}]);

};
